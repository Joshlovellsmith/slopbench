    "/analytics/revenue": {
      "get": {
        "operationId": "revenue",
        "summary": "revenue",
        "description": "Normative requirements: ANA-001, ANA-002. See round-00.md; schema does not replace arithmetic, cross-field, stream or transaction requirements.",
        "tags": [
          "ANA"
        ],
        "x-requirements": [
          "GEN-001",
          "GEN-002",
          "GEN-003",
          "GEN-004",
          "GEN-005",
          "ANA-001",
          "ANA-002"
        ],
        "parameters": [
          {
            "name": "from",
            "in": "query",
            "required": true,
            "description": "Inclusive UTC lower bound; ANA-001.",
            "schema": {
              "type": "string",
              "format": "date-time",
              "minLength": 24,
              "maxLength": 24,
              "pattern": "^20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}Z$",
              "description": "Real Gregorian instant in [2000-01-01T00:00:00.000Z,2100-01-01T00:00:00.000Z)."
            }
          },
          {
            "name": "to",
